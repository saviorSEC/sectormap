<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link href="assets/favicon.ico" rel="icon" sizes="any"/>
<title>CHURCH OF MALWARE // GALAXY VIEW — FLOCK NETWORK ARCHIVE</title>
<style>
  :root {
    --bg: #04060c;
    --panel: rgba(8, 14, 24, 0.88);
    --line: rgba(0, 255, 170, 0.18);
    --accent: #00ffaa;
    --accent2: #00d0ff;
    --warn: #ffb020;
    --bad: #ff4d6d;
    --ok: #2bff88;
    --text: #c8d6e0;
    --dim: #5b6b78;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden; }
  #bg { position: fixed; inset: 0; z-index: 0; }
  .hud { position: fixed; top: 14px; left: 16px; z-index: 20; pointer-events: none; }
  .hud .brand { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #eaf4ee; }
  .hud .brand span { color: var(--accent); }
  .hud .sub { font-size: 9px; letter-spacing: 3px; color: var(--dim); margin-top: 3px; text-transform: uppercase; }
  .hud .badge { display: inline-block; margin-top: 8px; padding: 2px 8px; font-size: 9px;
    letter-spacing: 2px; border: 1px solid var(--warn); color: var(--warn); border-radius: 2px; }
  .stats { position: fixed; top: 14px; right: 16px; z-index: 20; text-align: right; pointer-events: none; }
  .stats .num { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
  .stats .lbl { font-size: 8px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
  .stats .row { display: flex; gap: 18px; justify-content: flex-end; margin-top: 6px; }
  .stats .row div { text-align: right; }
  .topbar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 30;
    display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px; }
  .topbar .mode { color: var(--dim); background: transparent; border: none; font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; cursor: pointer;
    font-family: inherit; }
  .topbar .mode.active { color: var(--accent); background: rgba(0,255,170,0.08); border: 1px solid var(--line); }
  .topbar .mode:hover { color: var(--text); }
  .topbar .sep { width: 1px; background: var(--line); margin: 2px 2px; }
  .topbar .orbitToggle { color: var(--dim); background: transparent; border: 1px solid var(--line); font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; padding: 5px 10px; border-radius: 4px; cursor: pointer;
    font-family: inherit; }
  .topbar .orbitToggle.on { color: var(--accent); border-color: var(--accent); }
  #stage { position: fixed; inset: 0; z-index: 1; }
  .cluster { position: absolute; z-index: 2; transform: translate(-50%, -50%);
    cursor: pointer; text-align: center; border-radius: 50%; }
  .cluster .orb { width: 100%; height: 100%; border-radius: 50%; position: relative;
    box-shadow: 0 0 40px 6px var(--glow), inset 0 0 30px rgba(255,255,255,0.08); }
  .cluster .orb::after { content: ""; position: absolute; inset: 18%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), transparent 60%); }
  .cluster .label { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text);
    white-space: nowrap; text-shadow: 0 0 8px #000; pointer-events: none; }
  .cluster .label b { color: var(--accent); font-weight: 700; }
  .cluster:hover .orb { box-shadow: 0 0 60px 12px var(--glow), inset 0 0 30px rgba(255,255,255,0.15); }
  .record { position: absolute; z-index: 3; transform: translate(-50%, -50%);
    width: 7px; height: 7px; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle, #fff 0%, var(--rc) 45%, transparent 75%);
    box-shadow: 0 0 8px 1px var(--rc); transition: transform 0.15s; }
  .record::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
  .record:hover { transform: translate(-50%, -50%) scale(2.4); z-index: 5; }
  .record.sel { transform: translate(-50%, -50%) scale(2.6); box-shadow: 0 0 14px 3px #fff, 0 0 20px 6px var(--rc); z-index: 6; }
  .tooltip { position: fixed; z-index: 40; background: rgba(4, 8, 14, 0.96); border: 1px solid var(--line);
    padding: 8px 12px; font-size: 10px; letter-spacing: 1px; color: var(--text);
    max-width: 320px; pointer-events: none; border-radius: 4px; display: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7); }
  .tooltip b { color: var(--accent); }
  #searchWrap { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 30;
    width: min(640px, calc(100vw - 32px)); }
  #search { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 12px 16px; font-size: 12px; letter-spacing: 1px; border-radius: 6px; font-family: inherit;
    outline: none; }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,255,170,0.15); }
  #results { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; max-height: 300px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: none; }
  #results .r { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
  #results .r:hover { background: rgba(0,255,170,0.07); }
  #results .r .t { font-size: 11px; color: #fff; letter-spacing: 0.5px; }
  #results .r .m { font-size: 9px; color: var(--dim); margin-top: 3px; }
  #results .r .tag { float: right; font-size: 8px; letter-spacing: 1px; color: var(--accent); border: 1px solid var(--line); padding: 1px 6px; border-radius: 2px; }
  #drawer { position: fixed; top: 0; right: -460px; width: min(440px, 92vw); height: 100%; z-index: 50;
    background: var(--panel); border-left: 1px solid var(--line); transition: right 0.25s ease;
    overflow-y: auto; padding: 20px; backdrop-filter: blur(8px); }
  #drawer.open { right: 0; }
  #drawer .close { position: absolute; top: 12px; right: 14px; background: none; border: 1px solid var(--line);
    color: var(--dim); font-size: 11px; padding: 4px 9px; cursor: pointer; border-radius: 3px; font-family: inherit; }
  #drawer .close:hover { color: var(--bad); border-color: var(--bad); }
  #drawer h2 { font-size: 15px; color: #fff; letter-spacing: 1px; padding-right: 40px; line-height: 1.35; }
  #drawer .type { font-size: 9px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-top: 6px; }
  #drawer .src { font-size: 9px; letter-spacing: 2px; color: var(--dim); margin-top: 3px; }
  #drawer .desc { font-size: 11px; color: var(--text); line-height: 1.6; margin-top: 12px; }
  #drawer .kv { margin-top: 14px; }
  #drawer .kv .k { font-size: 8px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 3px; }
  #drawer .kv .v { font-size: 11px; color: var(--text); margin-bottom: 10px; word-break: break-all; }
  #drawer .kv .v.zone { color: var(--zonecolor); font-weight: 700; }
  .status { display: inline-block; padding: 2px 8px; font-size: 9px; letter-spacing: 1px; border-radius: 2px; }
  .status.ok { background: rgba(43,255,136,0.12); color: var(--ok); border: 1px solid rgba(43,255,136,0.4); }
  .status.warn { background: rgba(255,176,32,0.12); color: var(--warn); border: 1px solid rgba(255,176,32,0.4); }
  .status.bad { background: rgba(255,77,109,0.12); color: var(--bad); border: 1px solid rgba(255,77,109,0.4); }
  #drawer .actions { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  #drawer .actions a, #drawer .actions button { flex: 1; min-width: 130px; text-align: center; text-decoration: none;
    padding: 11px 10px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border-radius: 4px;
    border: 1px solid var(--line); background: rgba(0,255,170,0.06); color: var(--accent); cursor: pointer;
    font-family: inherit; }
  #drawer .actions a:hover, #drawer .actions button:hover { background: rgba(0,255,170,0.16); }
  #drawer .actions .ghost { background: transparent; color: var(--dim); }
  #drawer .actions .ghost:hover { color: var(--text); border-color: var(--dim); }
  #drawer .actions a.disabled { opacity: 0.35; pointer-events: none; }
  .recordList { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .recordList .rl { padding: 9px 10px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 6px;
    cursor: pointer; border-radius: 3px; font-size: 10px; }
  .recordList .rl:hover { border-color: var(--accent); }
  .recordList .rl .c { color: var(--accent); }
  .hint { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 9px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; pointer-events: none;
    background: rgba(4,6,12,0.7); padding: 4px 10px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.05); }
  .legend { position: fixed; bottom: 22px; left: 16px; z-index: 20; font-size: 9px; letter-spacing: 1px;
    color: var(--dim); pointer-events: none; max-width: 240px; }
  .legend .li { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
  .legend .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .credit { position: fixed; bottom: 22px; right: 16px; z-index: 20; font-size: 8px; letter-spacing: 2px;
    color: rgba(91,107,120,0.6); text-transform: uppercase; pointer-events: none; }
  @media (max-width: 768px) {
    .topbar { top: 60px; }
    .stats { display: none; }
    .hint { display: none; }
    .legend { display: none; }
    #drawer { padding: 14px; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="hud">
  <div class="brand">CHURCH OF <span>MALWARE</span></div>
  <div class="sub">FLOCK NETWORK ARCHIVE // GALAXY VIEW</div>
  <div class="badge">SECTORMAP OSINT</div>
</div>
<div class="stats" id="stats">
  <div class="num" id="statTotal">0</div>
  <div class="lbl">records</div>
  <div class="row">
    <div><div class="num" id="statTypes" style="font-size:15px">0</div><div class="lbl">types</div></div>
    <div><div class="num" id="statZones" style="font-size:15px">0</div><div class="lbl">zones</div></div>
    <div><div class="num" id="statLive" style="font-size:15px">0</div><div class="lbl">live hosts</div></div>
  </div>
</div>
<div class="topbar" id="modes"></div>
<div id="stage"></div>
<div class="tooltip" id="tooltip"></div>
<div class="hint">click a body to focus · click a star for endpoint intel · search below</div>
<div class="legend" id="legend"></div>
<div class="credit">BASE ENGINE // JON "GAINSEC" GAINES · ENRICHED BY CHURCH OF MALWARE</div>
<div id="searchWrap">
  <div id="results"></div>
  <input id="search" type="text" placeholder="SEARCH ARCHIVE — hostname, city, zone, role, tag…" autocomplete="off" />
</div>
<div id="drawer">
  <button class="close" id="drawerClose">ESC / CLOSE</button>
  <h2 id="dTitle"></h2>
  <div class="type" id="dType"></div>
  <div class="src" id="dSrc"></div>
  <p class="desc" id="dDesc"></p>
  <div class="kv" id="dKv"></div>
  <div class="actions" id="dActions"></div>
  <div class="recordList" id="dList"></div>
</div>
<script src="sectormap-data.js"></script>
<script>
(() => {
  const ARCH = window.SECTORMAP_ARCHIVE;
  if (!ARCH) return;
  const RECORDS = ARCH.records;
  const byId = new Map(RECORDS.map(r => [r.id, r]));
  const TYPE_COLORS = {
    "subdomain": "#00d0ff", "infrastructure": "#a78bfa", "zone": "#e879f9",
    "camera-network": "#ffd166", "camera-city": "#2bff88",
  };
  const ZONE_COLORS = {
    "z-edge": "#00ffaa", "z-aws": "#ffb020", "z-web": "#ffd166", "z-dev": "#a78bfa",
    "z-gov": "#ff6b6b", "z-ops": "#ff9f1c", "z-saas": "#00d0ff", "z-k8s": "#f472b6",
    "z-int": "#94a3b8", "z-data": "#60a5fa", "z-mon": "#e879f9", "public-map": "#2bff88",
  };
  const stage = document.getElementById("stage");
  const tooltip = document.getElementById("tooltip");
  const modesEl = document.getElementById("modes");
  const legendEl = document.getElementById("legend");
  const drawer = document.getElementById("drawer");
  const searchInput = document.getElementById("search");
  const resultsEl = document.getElementById("results");
  let currentMode = "type";
  let focusKey = null;
  let selectedId = null;
  let animFrame = null;
  let orbiters = [];
  let activeCluster = null;
  let orbitOn = true;
  let frozenTime = 0;

  // ---------- starfield ----------
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  let stars = [];
  function resize() {
    canvas.width = innerWidth; canvas.height = innerHeight;
    stars = Array.from({ length: Math.min(260, innerWidth / 6) }, () => ({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.4 + 0.05, tw: Math.random() * Math.PI * 2,
    }));
  }
  function drawBg(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const st of stars) {
      st.y -= st.s; if (st.y < -2) { st.y = canvas.height + 2; st.x = Math.random() * canvas.width; }
      const a = 0.35 + 0.4 * Math.sin(t / 900 + st.tw);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#9fd8ff";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  addEventListener("resize", resize); resize();

  // ---------- helpers ----------
  function esc(v) { return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
  function fmtN(n) { return Number(n || 0).toLocaleString("en-US"); }
  function clusterKey(rec) {
    if (currentMode === "zone") return rec.extras?.zone || "public-map";
    if (currentMode === "source") return rec.source || "unknown";
    if (currentMode === "tag") { const t = (rec.tags || "").split(",").filter(Boolean); return t[0] || "untagged"; }
    return rec.type || "untyped";
  }
  function clusterLabel(key) {
    if (currentMode === "zone") {
      const z = key === "public-map" ? "Public Map" : key.replace("z-", "").toUpperCase();
      return z;
    }
    return key.replace(/-/g, " ").replace(/\b\w/g, m => m.toUpperCase());
  }
  function clusterColor(key, idx) {
    if (currentMode === "zone") return ZONE_COLORS[key] || "#5b6b78";
    return TYPE_COLORS[key] || ["#7be7ff", "#ff5db1", "#8fffbe", "#8a9fff", "#b997ff"][idx % 5];
  }

  // ---------- layout ----------
  function buildGalaxy() {
    const groups = {};
    for (const r of RECORDS) {
      const k = clusterKey(r);
      (groups[k] = groups[k] || []).push(r);
    }
    const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
    const total = entries.length;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    const R = Math.min(innerWidth, innerHeight) * 0.32;
    const clusters = entries.map(([key, recs], i) => {
      const ang = (i / Math.max(1, total)) * Math.PI * 2 - Math.PI / 2;
      const r = R * (0.55 + 0.45 * (i % 3) / 2);
      return {
        key, recs, x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r * 0.82,
        color: clusterColor(key, i),
      };
    });
    return clusters;
  }

  // ---------- rendering ----------
  function renderLegend(clusters) {
    legendEl.innerHTML = "";
    clusters.slice(0, 9).forEach(c => {
      const li = document.createElement("div");
      li.className = "li";
      li.style.cursor = "pointer";
      li.style.pointerEvents = "auto";
      li.innerHTML = `<span class="sw" style="background:${c.color}"></span>${esc(clusterLabel(c.key))} — ${fmtN(c.recs.length)}`;
      li.onclick = () => { focusKey = c.key; selectedId = null; drawGalaxy(); };
      legendEl.appendChild(li);
    });
  }

  function renderModes() {
    modesEl.innerHTML = "";
    ["type", "zone", "source", "tag"].forEach(m => {
      const b = document.createElement("button");
      b.className = "mode" + (m === currentMode ? " active" : "");
      b.textContent = m;
      b.onclick = () => { currentMode = m; focusKey = null; selectedId = null; drawGalaxy(); };
      modesEl.appendChild(b);
    });
    const sep = document.createElement("span");
    sep.className = "sep";
    modesEl.appendChild(sep);
    const orbitBtn = document.createElement("button");
    orbitBtn.className = "orbitToggle on";
    orbitBtn.id = "orbitToggle";
    orbitBtn.textContent = "ORBIT: ON";
    orbitBtn.onclick = () => {
      orbitOn = !orbitOn;
      orbitBtn.textContent = "ORBIT: " + (orbitOn ? "ON" : "OFF");
      orbitBtn.classList.toggle("on", orbitOn);
      if (!orbitOn) { frozenTime = performance.now(); positionOrbiters(frozenTime); cancelAnimationFrame(animFrame); }
      else tick();
    };
    modesEl.appendChild(orbitBtn);
  }

  function drawGalaxy() {
    cancelAnimationFrame(animFrame);
    stage.innerHTML = "";
    orbiters = [];
    activeCluster = null;
    const clusters = buildGalaxy();
    renderLegend(clusters);

    clusters.forEach(c => {
      const size = Math.max(52, Math.min(150, 34 + Math.sqrt(c.recs.length) * 6.5));
      const el = document.createElement("div");
      el.className = "cluster";
      el.style.left = c.x + "px"; el.style.top = c.y + "px";
      el.style.width = size + "px"; el.style.height = size + "px";
      el.style.setProperty("--glow", c.color + "66");
      el.innerHTML = `<div class="orb" style="background:radial-gradient(circle at 40% 35%, ${c.color}cc, ${c.color}33 70%)"></div>
        <div class="label">${esc(clusterLabel(c.key))} <b>${fmtN(c.recs.length)}</b></div>`;
      el.onclick = () => { focusKey = (focusKey === c.key) ? null : c.key; selectedId = null; drawGalaxy(); };
      stage.appendChild(el);
    });

    if (focusKey) {
      const c = clusters.find(x => x.key === focusKey);
      if (c) {
        activeCluster = c;
        const shown = c.recs.slice(0, 140);
        const step = c.recs.length > shown.length ? (c.recs.length / shown.length) : 1;
        shown.forEach((rec, i) => {
          const rad = Math.max(90, sizeOf(c) / 2 + 46 + (i % 9) * 24);
          const ang = (i / Math.max(1, shown.length)) * Math.PI * 2 + (i % 7) * 0.15;
          const node = document.createElement("div");
          node.className = "record";
          const rc = rec.extras?.zone ? (ZONE_COLORS[rec.extras.zone] || "#7be7ff") : (TYPE_COLORS[rec.type] || "#7be7ff");
          node.style.setProperty("--rc", rc);
          node.dataset.id = rec.id;
          node.onmouseenter = (e) => showTip(e, rec);
          node.onmousemove = (e) => moveTip(e);
          node.onmouseleave = () => { tooltip.style.display = "none"; };
          node.onclick = () => selectRecord(rec.id);
          stage.appendChild(node);
          orbiters.push({ el: node, x: c.x, y: c.y, rad, ang, speed: 0.00028 + (i % 11) * 0.00005, rec });
        });
        if (c.recs.length > shown.length) {
          const more = document.createElement("div");
          more.className = "hint";
          more.style.position = "fixed";
          more.style.left = "50%"; more.style.top = "64px";
          more.style.transform = "translateX(-50%)";
          more.style.zIndex = 10;
          more.textContent = `focus: ${esc(clusterLabel(c.key))} — showing ${shown.length} of ${fmtN(c.recs.length)} records · all in drawer`;
          stage.appendChild(more);
          setTimeout(() => more.remove(), 6000);
        }
      }
    }
    tick();
  }

  function sizeOf(c) { return Math.max(52, Math.min(150, 34 + Math.sqrt(c.recs.length) * 6.5)); }

  function positionOrbiters(time = 0) {
    for (const o of orbiters) {
      const a = o.ang + time * o.speed;
      o.el.style.left = (o.x + Math.cos(a) * o.rad) + "px";
      o.el.style.top = (o.y + Math.sin(a) * o.rad * 0.7) + "px";
    }
  }

  function tick(time = 0) {
    if (!orbitOn) return;
    positionOrbiters(time);
    animFrame = requestAnimationFrame(tick);
  }

  function showTip(e, rec) {
    const zone = rec.extras?.zone_name ? ` · ${esc(rec.extras.zone_name)}` : "";
    const ip = rec.extras?.ip ? ` · ${esc(rec.extras.ip)}` : "";
    const st = rec.extras?.http_status ? ` · HTTP ${rec.extras.http_status}` : "";
    tooltip.innerHTML = `<b>${esc(rec.title)}</b><br><span style="color:var(--dim)">${esc(rec.type)}${zone}${ip}${st}</span>`;
    tooltip.style.display = "block";
    moveTip(e);
  }
  function moveTip(e) {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tooltip.getBoundingClientRect();
    if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
    if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
    tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
  }

  // ---------- selection / drawer ----------
  function selectRecord(id) {
    selectedId = id;
    const rec = byId.get(id);
    if (!rec) return;
    document.querySelectorAll(".record").forEach(n => n.classList.toggle("sel", n.dataset.id == id));
    openDrawer(rec);
  }

  function statusClass(code) {
    if (code == null) return null;
    if (code < 400) return "ok";
    if (code < 500) return "warn";
    return "bad";
  }
  function statusText(code) {
    if (code == null) return "NO HTTP RESPONSE";
    return "HTTP " + code;
  }

  function openDrawer(rec) {
    const ex = rec.extras || {};
    document.getElementById("dTitle").textContent = rec.title;
    document.getElementById("dType").textContent = rec.type + (ex.role ? " // " + ex.role : "");
    document.getElementById("dSrc").textContent = "SOURCE // " + (rec.source || "unknown");
    document.getElementById("dDesc").textContent = rec.description || "No description loaded.";
    const kv = document.getElementById("dKv");
    kv.innerHTML = "";
    const addKV = (k, v, cls) => {
      const d = document.createElement("div");
      d.className = "kv";
      d.innerHTML = `<div class="k">${esc(k)}</div><div class="v ${cls || ""}">${v}</div>`;
      kv.appendChild(d);
    };
    if (ex.zone_name) addKV("Zone", `<span style="color:${ex.color || ZONE_COLORS[ex.zone] || "var(--accent)"}">${esc(ex.zone_name)}</span>`, "zone");
    if (ex.role) addKV("Role", esc(ex.role));
    if (ex.ip) addKV("Resolved IP", esc(ex.ip));
    if (ex.dns && ex.dns.length) addKV("DNS (passive)", esc(ex.dns.join(", ")));
    if (ex.http_status != null) addKV("Endpoint status", `<span class="status ${statusClass(ex.http_status)}">${statusText(ex.http_status)}</span>`);
    if (ex.server) addKV("Server", esc(ex.server));
    if (ex.count != null) addKV("Camera count", fmtN(ex.count));
    if (ex.lat != null && ex.lon != null) addKV("Centroid", `${ex.lat.toFixed(4)}, ${ex.lon.toFixed(4)}`);
    if (ex.endpoints && ex.endpoints.length) addKV("Known endpoints", esc(ex.endpoints.slice(0, 20).join(" · ")));
    if (rec.tags) addKV("Tags", esc(rec.tags));
    if (rec.url) addKV("URL", `<a href="${esc(rec.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(rec.url)}</a>`);

    const acts = document.getElementById("dActions");
    acts.innerHTML = "";
    const openBtn = document.createElement("a");
    openBtn.textContent = "OPEN ENDPOINT ↗";
    openBtn.href = rec.url || "#";
    openBtn.target = "_blank"; openBtn.rel = "noopener";
    if (!rec.url) openBtn.classList.add("disabled");
    acts.appendChild(openBtn);
    const copyBtn = document.createElement("button");
    copyBtn.textContent = "COPY HOST";
    copyBtn.className = "ghost";
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(rec.url ? rec.url.replace("https://", "") : rec.title).then(() => {
        copyBtn.textContent = "COPIED ✓";
        setTimeout(() => (copyBtn.textContent = "COPY HOST"), 1200);
      });
    };
    acts.appendChild(copyBtn);
    const closeBtn = document.createElement("button");
    closeBtn.textContent = "DISMISS";
    closeBtn.className = "ghost";
    closeBtn.onclick = () => closeDrawer();
    acts.appendChild(closeBtn);

    // sibling records in the same cluster — ALL of them, clickable
    const list = document.getElementById("dList");
    list.innerHTML = "";
    if (activeCluster && activeCluster.recs.length > 1) {
      const h = document.createElement("div");
      h.className = "k";
      h.style.cssText = "font-size:8px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px";
      h.textContent = `SECTOR RECORDS — ${fmtN(activeCluster.recs.length)} IN FOCUS (CLICK ANY)`;
      list.appendChild(h);
      activeCluster.recs.forEach(r => {
        const row = document.createElement("div");
        row.className = "rl";
        row.innerHTML = `<span class="c">${esc(r.title)}</span> <span style="color:var(--dim)">· ${esc(r.type)}</span>${r.extras?.http_status != null ? ` <span class="status ${statusClass(r.extras.http_status)}">${r.extras.http_status}</span>` : ""}${r.extras?.count != null ? ` <span style="color:var(--dim)">· ${fmtN(r.extras.count)} cams</span>` : ""}`;
        row.onclick = () => selectRecord(r.id);
        if (r.id === rec.id) row.style.borderColor = "var(--accent)";
        list.appendChild(row);
      });
    }
    drawer.classList.add("open");
  }

  function closeDrawer() {
    drawer.classList.remove("open");
    document.querySelectorAll(".record").forEach(n => n.classList.remove("sel"));
    selectedId = null;
  }

  document.getElementById("drawerClose").onclick = closeDrawer;
  addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (drawer.classList.contains("open")) closeDrawer();
      else if (focusKey) { focusKey = null; selectedId = null; drawGalaxy(); }
    }
  });

  // ---------- search ----------
  let searchTimer = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { resultsEl.style.display = "none"; return; }
    searchTimer = setTimeout(() => {
      const hits = RECORDS.filter(r => {
        const hay = (r.title + " " + (r.description || "") + " " + (r.tags || "") + " " + (r.extras?.role || "") + " " + (r.extras?.zone_name || "")).toLowerCase();
        return q.split(/\s+/).every(t => hay.includes(t));
      }).slice(0, 20);
      resultsEl.innerHTML = "";
      if (!hits.length) {
        resultsEl.innerHTML = `<div class="r"><div class="m">NO MATCHES — try a hostname, city, zone, or role</div></div>`;
      }
      hits.forEach(r => {
        const row = document.createElement("div");
        row.className = "r";
        row.innerHTML = `<span class="tag">${esc(r.type)}</span><div class="t">${esc(r.title)}</div><div class="m">${esc((r.extras?.role || r.description || "").slice(0, 90))}</div>`;
        row.onclick = () => {
          resultsEl.style.display = "none";
          searchInput.value = "";
          // fly to the record's cluster and select it
          currentMode = "type";
          focusKey = r.type;
          if (r.extras?.zone && r.type === "subdomain") { currentMode = "zone"; focusKey = r.extras.zone; }
          drawGalaxy();
          setTimeout(() => {
            const node = document.querySelector(`.record[data-id="${r.id}"]`);
            if (node) { node.scrollIntoView({ block: "center" }); selectRecord(r.id); }
            else selectRecord(r.id);
          }, 80);
        };
        resultsEl.appendChild(row);
      });
      resultsEl.style.display = "block";
    }, 140);
  });
  document.addEventListener("click", (e) => {
    if (!resultsEl.contains(e.target) && e.target !== searchInput) resultsEl.style.display = "none";
  });

  // ---------- stats ----------
  document.getElementById("statTotal").textContent = fmtN(RECORDS.length);
  document.getElementById("statTypes").textContent = ARCH.stats.total_types;
  document.getElementById("statZones").textContent = Object.keys(ZONE_COLORS).length;
  document.getElementById("statLive").textContent = RECORDS.filter(r => r.extras?.http_status != null && r.extras.http_status < 400).length;

  // ---------- boot ----------
  renderModes();
  drawGalaxy();
  setInterval(() => drawBg(performance.now()), 40);
})();
</script>
</body>
</html>
